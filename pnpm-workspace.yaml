allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  msw: true
  node-pty: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true
# Next.js >=16.4.0 supports ESLint 10 and patches the legacy React/import APIs.
# Scope peer metadata fixes to the verified plugin versions; review on upgrades.
# https://nextjs.org/docs/app/guides/upgrading/version-16#installation-fails-after-upgrading-eslint
overrides:
  "eslint-plugin-react@7.37.5>eslint": "^3 || ^4 || ^5 || ^6 || ^7 || ^8 || ^9.7 || ^10.13.0"
  "eslint-plugin-import@2.32.0>eslint": "^2 || ^3 || ^4 || ^5 || ^6 || ^7.2.0 || ^8 || ^9 || ^10.13.0"
  "eslint-plugin-jsx-a11y@6.10.2>eslint": "^3 || ^4 || ^5 || ^6 || ^7 || ^8 || ^9 || ^10.13.0"
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
trustPolicyExclude:
  - eslint-import-resolver-typescript@3.10.1
  - semver@6.3.1
  - why-is-node-running@3.2.2
